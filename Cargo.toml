[package]
name = "plausiden-purge"
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"
description = "Storage sovereignty engine — intelligent app tracking, archival, and secure data destruction"
repository = "https://github.com/redcaptian1917/PlausiDen-Purge"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
rand = "0.8"
bytesize = "2"
chacha20poly1305 = "0.10"
blake3 = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
